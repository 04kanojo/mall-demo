  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB

mybatis-plus:
  global-config:
    db-config:
      logic-not-delete-value: 0
      logic-delete-value: 1
      logic-delete-field: isDeleted
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 本地缓存配置默认加载给远程(只配本地不会报错)(建议都配)
jetcache:
  # 过一分钟控制台输出一个缓存命中率
  #  statIntervalMinutes: 1
  #设置不把areaName作为Key前缀
  areaInCacheName: false

  # 本地缓存
  local:
    default:
      type: linkedhashmap
      # 使用json工具技术
      keyConvertor: fastjson

  # 远程缓存
  remote:
    sms:
      # 全局失效时间(毫秒为单位)
      #      expireAfterWriteInMillis: 3600
      type: redis
      port: 6379
      host: localhost
      valueEncoder: java
      valueDecoder: java
      keyConvertor: fastjson
      # 这个配置至少有一个内容,不然会报错
      poolConfig:
        #最大连接数
        maxTotal: 50

    # 默认
    default:
      type: redis
      port: 6379
      host: localhost
      valueEncoder: java
      valueDecoder: java
      keyConvertor: fastjson
      poolConfig:
        #最大连接数
        maxTotal: 50